{% extends "base.html" %}
{% block titulo %}Asistencia{% endblock %}
{% block contenido %}
<h2>Asistencia</h2>
<form method="post" class="fila">
  <select name="cliente" required>
    <option value="">Cliente...</option>
    {% for c in clientes %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
  </select>
  <button type="submit">Registrar entrada</button>
</form>
<table>
  <thead><tr><th>Cliente</th><th>Fecha y hora</th></tr></thead>
  <tbody>
  {% for a in asistencias %}
    <tr><td>{{ a.clientes.nombre }}</td><td>{{ a.fecha_hora }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
